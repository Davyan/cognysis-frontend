<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognysis — Live Call Monitor</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Live-call specific overrides */
        .live-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .status { font-size: 32px; font-weight: 800; margin: 12px 0; }
        .status.initiated { color: #6b7280; }
        .status.ongoing { color: #f59e0b; }
        .status.completed { color: #10b981; }
        .status.failed { color: #ef4444; }
        .transcript { background: #f9fafb; padding: 20px; border-radius: 10px; margin-top: 16px; max-height: 500px; overflow-y: auto; }
        .turn { margin: 12px 0; padding: 14px 18px; border-radius: 12px; animation: fadeIn 0.3s ease; }
        .turn.agent { background: #dbeafe; margin-right: 60px; border-left: 4px solid #3b82f6; }
        .turn.user { background: #d1fae5; margin-left: 60px; text-align: right; border-right: 4px solid #10b981; }
        .turn .role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; color: #6b7280; }
        .turn .role.nurse { color: #2563eb; }
        .turn .role.patient { color: #059669; }
        .turn .content { font-size: 15px; line-height: 1.5; }
        .recording { margin-top: 16px; padding: 16px; background: #fef3c7; border-radius: 10px; border: 1px solid #fcd34d; }
        .recording a { color: #b45309; font-weight: 600; text-decoration: none; }
        .recording a:hover { text-decoration: underline; }
        .recording-meta { font-size: 12px; color: #92400e; margin-top: 8px; }
        .risk-low { color: #10b981; }
        .risk-medium { color: #f59e0b; }
        .risk-high { color: #ef4444; }
        .risk-unknown { color: #6b7280; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
        .metric { background: #f3f4f6; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #e5e7eb; }
        .metric .value { font-size: 36px; font-weight: 800; color: #111827; }
        .metric .label { font-size: 12px; color: #6b7280; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
        .timer { font-size: 14px; color: #6b7280; margin-top: 8px; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
        .info-label { color: #6b7280; font-size: 14px; }
        .info-value { font-weight: 600; }
        .empty-state { text-align: center; padding: 40px; color: #9ca3af; }
        .alert-info { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; padding: 12px 16px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="live-container">
        <h1>🔴 Live Call Monitor</h1>
        <p style="color: #6b7280; margin-bottom: 24px;">Real-time cognitive screening session</p>

        <!-- Call Info Card -->
        <div class="card">
            <div class="card-header"><div class="card-title">📞 Call Information</div></div>
            <div class="info-row">
                <span class="info-label">Patient</span>
                <span class="info-value" id="patientName">Loading...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Phone</span>
                <span class="info-value" id="patientPhone">...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Call ID</span>
                <span class="info-value" id="callId" style="font-family: monospace; font-size: 12px;">...</span>
            </div>
            <div class="status initiated" id="status">LOADING...</div>
            <div class="timer" id="timer">
                <span class="spinner"></span> Connecting to server...
            </div>
        </div>

        <!-- Analysis Card -->
        <div class="card hidden" id="analysisCard">
            <div class="card-header"><div class="card-title">📊 Live Analysis</div></div>
            <div class="metrics">
                <div class="metric">
                    <div class="value" id="patientWords">0</div>
                    <div class="label">Patient Words</div>
                </div>
                <div class="metric">
                    <div class="value" id="orientationScore">0</div>
                    <div class="label">Orientation /100</div>
                </div>
                <div class="metric">
                    <div class="value risk-unknown" id="riskFlag">—</div>
                    <div class="label">Risk Level</div>
                </div>
            </div>
            <div class="metrics" style="margin-top: 12px;">
                <div class="metric">
                    <div class="value" id="agentWords">0</div>
                    <div class="label">Nurse Words</div>
                </div>

                    <div class
